---
- name: Check for NetworkManager
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d
  register: wifi_hotspot_nm_conf_dir

- name: Exclude wifi interface from NetworkManager
  ansible.builtin.copy:
    content: |
      [keyfile]
      unmanaged-devices=interface-name:{{ wifi_hotspot_interface }}
    dest: /etc/NetworkManager/conf.d/10-sbc-wifi-hotspot.conf
    mode: "0644"
  when: wifi_hotspot_nm_conf_dir.stat.exists and wifi_hotspot_nm_conf_dir.stat.isdir
  notify: Restart NetworkManager

- name: Apply NetworkManager changes before starting the hotspot
  ansible.builtin.meta: flush_handlers

- name: Create data directory
  ansible.builtin.file:
    path: "{{ wifi_hotspot_data_dir }}"
    state: directory
    mode: "0755"

- name: Create compose directory
  ansible.builtin.file:
    path: "{{ wifi_hotspot_compose_dir }}"
    state: directory
    mode: "0755"

- name: Deploy sbc-wifi-hotspot compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wifi_hotspot_compose_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy sbc-wifi-hotspot
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ wifi_hotspot_compose_dir }} up --detach --pull always --remove-orphans
  register: wifi_hotspot_up
  changed_when: (wifi_hotspot_up.stdout ~ wifi_hotspot_up.stderr) is search('Created|Recreated|Started')
