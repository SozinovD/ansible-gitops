---
- name: Detect active I2C buses
  ansible.builtin.find:
    paths: /dev
    patterns: i2c-*
    file_type: any
  register: pisugar_i2c_buses

- name: Check for raspi-config
  ansible.builtin.stat:
    path: /usr/bin/raspi-config
  register: pisugar_raspi_config

- name: Enable I2C interface
  ansible.builtin.command:
    cmd: raspi-config nonint do_i2c 0
  when: pisugar_i2c_buses.files | length == 0 and pisugar_raspi_config.stat.exists
  register: pisugar_i2c_enable
  changed_when: pisugar_i2c_enable.rc == 0
  notify: Reboot for I2C

- name: Mark reboot as pending
  ansible.builtin.set_fact:
    pisugar_reboot_needed: true
  when: pisugar_i2c_enable is changed
  changed_when: false

- name: Refuse to continue without I2C
  ansible.builtin.fail:
    msg: >-
      No active I2C bus found (/dev/i2c-*). Enable the I2C interface for your
      board and re-run: Raspberry Pi OS - raspi-config nonint do_i2c 0;
      Armbian - add the board i2c overlay to 'overlays=' in
      /boot/armbianEnv.txt (or armbian-config); Radxa official images -
      enable the i2c overlay via uconfig / vendor configuration. Reboot
      afterwards. If the header bus is not bus 1, point pisugar-server at
      the right device in /etc/default/pisugar-server (see
      https://github.com/PiSugar/pisugar-power-manager-rs).
  when: pisugar_i2c_buses.files | length == 0 and pisugar_i2c_enable is skipped

- name: Check for installed pisugar-server
  ansible.builtin.stat:
    path: /usr/bin/pisugar-server
  register: pisugar_server_bin

- name: Download PiSugar installer
  ansible.builtin.get_url:
    url: https://cdn.pisugar.com/release/pisugar-power-manager.sh
    dest: /tmp/pisugar-power-manager.sh
    mode: "0755"
  when: not pisugar_server_bin.stat.exists

- name: Install PiSugar power manager
  ansible.builtin.command:
    cmd: bash /tmp/pisugar-power-manager.sh --non-interactive --model '{{ pisugar_model }}'
    creates: /usr/bin/pisugar-server
  when: not pisugar_server_bin.stat.exists

- name: Ensure PiSugar server is enabled and started
  ansible.builtin.systemd_service:
    name: pisugar-server.service
    state: started
    enabled: true
  when: not pisugar_reboot_needed | default(false)

- name: Ensure PiSugar poweroff hook is enabled
  ansible.builtin.systemd_service:
    name: pisugar-poweroff.service
    enabled: true
  when: not pisugar_reboot_needed | default(false)

- name: Read PiSugar server config
  ansible.builtin.slurp:
    src: /etc/pisugar-server/config.json
  register: pisugar_server_config_raw

- name: Parse PiSugar server config
  ansible.builtin.set_fact:
    pisugar_server_config: "{{ pisugar_server_config_raw.content | b64decode | from_json }}"
  changed_when: false

- name: Check for custom low battery watchdog
  ansible.builtin.stat:
    path: /etc/systemd/system/pisugar-low-battery.timer
  register: pisugar_old_watchdog

- name: Stop and disable custom low battery watchdog
  ansible.builtin.systemd_service:
    name: pisugar-low-battery.timer
    state: stopped
    enabled: false
  when: pisugar_old_watchdog.stat.exists

- name: Remove custom low battery watchdog
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/pisugar-low-battery.service
    - /etc/systemd/system/pisugar-low-battery.timer
    - /usr/local/bin/pisugar-low-battery-check
  notify: Reload systemd manager

- name: Check pisugar-server process owner
  ansible.builtin.command:
    cmd: ps -o user= -C pisugar-server
  register: pisugar_server_user
  changed_when: false
  when: not pisugar_reboot_needed | default(false)

- name: Require root pisugar-server for safe shutdown
  ansible.builtin.assert:
    that:
      - pisugar_server_user.stdout_lines | default([]) | length > 0
      - pisugar_server_user.stdout_lines | default([]) | first | trim == 'root'
    msg: >-
      pisugar-server must run as root to execute the poweroff command of the
      built-in safe shutdown mechanism
    quiet: true
  when: not pisugar_reboot_needed | default(false)

- name: Apply built-in safe shutdown settings
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import socket
        import sys
        client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
        client.settimeout(5)
        client.connect("/tmp/pisugar-server.sock")
        for command in (
            "set_safe_shutdown_level {{ pisugar_safe_shutdown_level }}",
            "set_safe_shutdown_delay {{ pisugar_safe_shutdown_delay }}",
        ):
            client.sendall((command + "\n").encode())
            response = client.recv(4096).decode(errors="replace").strip()
            print(response)
            if not response.endswith("done"):
                sys.exit(1)
        client.close()
  register: pisugar_safe_shutdown_apply
  until: pisugar_safe_shutdown_apply.rc == 0
  retries: 3
  delay: 5
  when:
    - not pisugar_reboot_needed | default(false)
    - (pisugar_server_config.auto_shutdown_level | default(0) | float) != (pisugar_safe_shutdown_level | float)
      or (pisugar_server_config.auto_shutdown_delay | default(0) | float) != (pisugar_safe_shutdown_delay | float)

- name: Apply button tap reactions
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import socket
        import sys
        tap, shell = sys.argv[1], sys.argv[2]
        commands = ["set_button_enable {} {}".format(tap, 1 if shell else 0)]
        if shell:
            commands.append("set_button_shell {} {}".format(tap, shell))
        else:
            commands.append("set_button_shell {}".format(tap))
        client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
        client.settimeout(5)
        client.connect("/tmp/pisugar-server.sock")
        for command in commands:
            client.sendall((command + "\n").encode())
            response = client.recv(4096).decode(errors="replace").strip()
            print(response)
            if not response.endswith("done"):
                sys.exit(1)
        client.close()
      - "{{ pisugar_tap.key }}"
      - "{{ pisugar_tap.value | default('', true) }}"
  register: pisugar_tap_apply
  until: pisugar_tap_apply.rc == 0
  retries: 3
  delay: 5
  loop: "{{ pisugar_tap_shells | dict2items | sort(attribute='key') }}"
  loop_control:
    loop_var: pisugar_tap
  when:
    - not pisugar_reboot_needed | default(false)
    - (pisugar_server_config[pisugar_tap.key ~ '_tap_enable'] | default(false) | bool) != ((pisugar_tap.value | default('', true)) | length > 0)
      or (pisugar_server_config[pisugar_tap.key ~ '_tap_shell'] | default('')) != (pisugar_tap.value | default('', true))
