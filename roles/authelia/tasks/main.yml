---
- name: Check that the session domain is set
  ansible.builtin.fail:
    msg: authelia_session_domain is not set; configure it in host_vars/<hostname>.yml
  when: not authelia_session_domain | default('')

- name: Check that required secrets are set
  ansible.builtin.fail:
    msg: authelia_jwt_secret, authelia_session_secret and authelia_storage_encryption_key must be set in /etc/ansible-gitops/secrets.yml
  when: authelia_jwt_secret is not defined or authelia_session_secret is not defined or authelia_storage_encryption_key is not defined

- name: Create config directory
  ansible.builtin.file:
    path: "{{ authelia_config_dir }}"
    state: directory
    mode: "0755"

- name: Create secrets directory
  ansible.builtin.file:
    path: "{{ authelia_config_dir }}/secrets"
    state: directory
    mode: "0700"

- name: Create data directory
  ansible.builtin.file:
    path: "{{ authelia_data_dir }}"
    state: directory
    mode: "0755"

- name: Deploy authelia configuration
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: "{{ authelia_config_dir }}/configuration.yml"
    mode: "0644"
  notify: Restart authelia

- name: Deploy users database
  ansible.builtin.template:
    src: users_database.yml.j2
    dest: "{{ authelia_config_dir }}/users_database.yml"
    mode: "0600"
  notify: Restart authelia

- name: Deploy jwt secret
  ansible.builtin.copy:
    content: "{{ authelia_jwt_secret }}"
    dest: "{{ authelia_config_dir }}/secrets/jwt_secret"
    mode: "0600"
  no_log: true
  notify: Restart authelia

- name: Deploy session secret
  ansible.builtin.copy:
    content: "{{ authelia_session_secret }}"
    dest: "{{ authelia_config_dir }}/secrets/session_secret"
    mode: "0600"
  no_log: true
  notify: Restart authelia

- name: Deploy storage encryption key
  ansible.builtin.copy:
    content: "{{ authelia_storage_encryption_key }}"
    dest: "{{ authelia_config_dir }}/secrets/storage_encryption_key"
    mode: "0600"
  no_log: true
  notify: Restart authelia

- name: Create compose directory
  ansible.builtin.file:
    path: "{{ authelia_compose_dir }}"
    state: directory
    mode: "0755"

- name: Deploy authelia compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authelia_compose_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy authelia
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ authelia_compose_dir }} up --detach --pull always --remove-orphans
  register: authelia_up
  changed_when: (authelia_up.stdout ~ authelia_up.stderr) is search('Created|Recreated|Started')
