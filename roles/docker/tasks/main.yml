---
- name: Require Debian-based OS
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    quiet: true

- name: Install prerequisites
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ docker_apt_dist }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Deploy Docker apt repository file
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
  register: docker_repo

- name: Update apt cache after repository change
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo is changed

- name: Install Docker Engine
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
