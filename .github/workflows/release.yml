name: release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged release
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine next version
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ -z "${TAG}" ]]; then
            VERSION="0.0.$(git rev-list --count --first-parent HEAD)"
          elif [[ -n "$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)" ]]; then
            echo "HEAD already tagged, skipping"
            echo "SKIP=true" >> "${GITHUB_ENV}"
            exit 0
          else
            BASE="${TAG#v}"
            MAJOR="${BASE%%.*}"
            REST="${BASE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST##*.}"
            N="$(git rev-list --count --first-parent "${TAG}..HEAD")"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + N))"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "next version: ${VERSION}"

      - name: Create and push tag
        if: env.SKIP != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG} (PR #${PR_NUMBER}: ${PR_TITLE})"
          git push origin "${TAG}"
