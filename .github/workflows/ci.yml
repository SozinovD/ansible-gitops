name: ci

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Test, build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine version
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "${BRANCH}" == "main" || "${BRANCH}" == "master" ]]; then
            TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            if [[ -z "${TAG}" ]]; then
              VERSION="0.0.$(git rev-list --count --first-parent HEAD)"
            elif [[ -n "$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)" ]]; then
              VERSION="${TAG#v}"
            else
              BASE="${TAG#v}"
              MAJOR="${BASE%%.*}"
              REST="${BASE#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST##*.}"
              N="$(git rev-list --count --first-parent "${TAG}..HEAD")"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + N))"
            fi
          else
            SAFE_BRANCH="$(printf '%s' "${BRANCH}" | tr -cs 'a-zA-Z0-9._-' '-' | sed -e 's/^-*//' -e 's/-*$//')"
            [[ -n "${SAFE_BRANCH}" ]] || SAFE_BRANCH="branch"
            VERSION="${SAFE_BRANCH}-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version: ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: python3 -m pip install ansible-core pyyaml

      - name: Validate YAML files
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          failed = False
          files = set()
          for pattern in ("*.yml", "*.yaml", "**/*.yml", "**/*.yaml"):
              files.update(glob.glob(pattern, recursive=True))
          for f in sorted(files):
              if f.startswith(".git/") or f.startswith(".github/"):
                  continue
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
              except Exception as e:
                  failed = True
                  print(f"INVALID {f}: {e}")
          print(f"checked {len(files)} yaml files")
          sys.exit(1 if failed else 0)
          PY

      - name: Syntax-check playbooks and roles
        run: |
          {
            printf -- "---\n- name: CI syntax check\n  hosts: all\n  become: true\n  roles:\n"
            for d in roles/*/; do
              printf "    - %s\n" "$(basename "${d}")"
            done
          } > "${RUNNER_TEMP}/all-roles.yml"
          ANSIBLE_ROLES_PATH=roles ansible-playbook --syntax-check \
            -i "localhost ansible_connection=local," \
            "${RUNNER_TEMP}/all-roles.yml"

      - name: Build versioned zip
        run: |
          printf '%s' "${VERSION}" > VERSION
          zip -r "sbc-tools-${VERSION}.zip" . \
            -x '.git/*' '.github/*' 'sbc-tools-*.zip'

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbc-tools-${{ env.VERSION }}
          path: sbc-tools-${{ env.VERSION }}.zip
          if-no-files-found: error
