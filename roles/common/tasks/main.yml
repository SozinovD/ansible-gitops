---
- name: Require Debian-based OS
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    quiet: true

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy shell profile
  ansible.builtin.template:
    src: profile.sh.j2
    dest: "{{ common_profile_d_file }}"
    mode: "0644"
