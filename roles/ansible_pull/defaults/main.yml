---
ansible_pull_repo_url: git@github.com:SozinovD/sbc-tools.git
ansible_pull_checkout: main
ansible_pull_playbook: local.yml
ansible_pull_inventory: "{{ ansible_hostname }},"
ansible_pull_workdir: /var/lib/ansible-pull
ansible_pull_interval: 30min
ansible_pull_on_boot_sec: 5min
ansible_pull_randomized_delay: 5min
ansible_pull_only_changed: false
ansible_pull_clean: true
ansible_pull_deploy_key: ""
ansible_pull_key_path: /etc/ansible-pull/id_ed25519
