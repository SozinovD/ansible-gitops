---
oauth2_proxy_image: quay.io/oauth2-proxy/oauth2-proxy:latest
oauth2_proxy_compose_dir: /opt/oauth2-proxy
oauth2_proxy_container_name: oauth2-proxy
oauth2_proxy_restart_policy: unless-stopped
oauth2_proxy_ports:
  - "4180:4180"
oauth2_proxy_config_dir: /etc/oauth2-proxy
oauth2_proxy_provider: google
oauth2_proxy_allowed_emails: []
oauth2_proxy_email_domains: []
oauth2_proxy_cookie_domains: []
oauth2_proxy_whitelist_domains: []
oauth2_proxy_scope: "openid email profile"
oauth2_proxy_extra_env: {}
