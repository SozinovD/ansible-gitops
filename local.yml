---
- name: Self-managed SBC configuration
  hosts: all
  become: true
  pre_tasks:
    - name: Check for host secrets file
      ansible.builtin.stat:
        path: /etc/ansible-gitops/secrets.yml
      register: sbc_secrets_file
    - name: Load host secrets
      ansible.builtin.include_vars:
        file: /etc/ansible-gitops/secrets.yml
      when: sbc_secrets_file.stat.exists
    - name: Check for local roles file
      ansible.builtin.stat:
        path: /etc/ansible-gitops/roles.yml
      register: sbc_local_roles_file
    - name: Load local roles
      ansible.builtin.include_vars:
        file: /etc/ansible-gitops/roles.yml
        name: sbc_local_roles
      when: sbc_local_roles_file.stat.exists
    - name: Merge local roles into extra_roles
      ansible.builtin.set_fact:
        extra_roles: "{{ extra_roles | default([]) + (sbc_local_roles.extra_roles | default([]) | difference(extra_roles | default([]))) }}"
      when: sbc_local_roles_file.stat.exists
  roles:
    - role: ansible_pull
  tasks:
    - name: Apply device-specific roles
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ extra_roles | default([]) }}"
